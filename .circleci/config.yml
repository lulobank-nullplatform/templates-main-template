version: 2.1

jobs:
  build:
    docker:
      - image: cimg/base:2024.01
    steps:
      - checkout
      - run:
          name: Install nullplatform CLI
          command: curl https://cli.nullplatform.com/install.sh | sh
      - run:
          name: Start nullplatform CI
          command: |
            REPOSITORY_URL="${CIRCLE_REPOSITORY_URL%.git}"
            case "$REPOSITORY_URL" in
              git@*) REPOSITORY_URL="https://$(echo "$REPOSITORY_URL" | sed -E 's#^git@([^:]+):#\1/#')" ;;
            esac
            COMMIT_PERMALINK="${REPOSITORY_URL}/commit/${CIRCLE_SHA1}"
            DESCRIPTION="$(git log -1 --pretty=%B)"
            np build start \
              --repository "$REPOSITORY_URL" \
              --branch "$CIRCLE_BRANCH" \
              --commit-sha "$CIRCLE_SHA1" \
              --commit-permalink "$COMMIT_PERMALINK" \
              --description "$DESCRIPTION" \
              --format json --query .id > /tmp/np_build_id
            echo "Build ID: $(cat /tmp/np_build_id)"
      - setup_remote_docker:
          docker_layer_caching: false
      - run:
          name: Build asset
          command: docker build -t main .
      - run:
          name: Push asset
          command: |
            REPOSITORY_URL="${CIRCLE_REPOSITORY_URL%.git}"
            case "$REPOSITORY_URL" in
              git@*) REPOSITORY_URL="https://$(echo "$REPOSITORY_URL" | sed -E 's#^git@([^:]+):#\1/#')" ;;
            esac
            np asset push --type docker-image --source main \
              --build-id "$(cat /tmp/np_build_id)" \
              --repository "$REPOSITORY_URL"
      - run:
          name: Add quality & security metadata
          # Simulates the outcome of an external security scan + quality gates.
          # Once those finish, their results are attached to the nullplatform
          # build as metadata. One explicit call per spec so it's clear which
          # metadata is being injected and from which file.
          command: |
            BUILD_ID="$(cat /tmp/np_build_id)"
            echo "Injecting quality & security metadata into build ${BUILD_ID}..."

            echo "  - coverage"
            np metadata create --entity build --id "$BUILD_ID" \
              --data "$(cat .nullplatform/metadata/coverage.json)"

            echo "  - security"
            np metadata create --entity build --id "$BUILD_ID" \
              --data "$(cat .nullplatform/metadata/security.json)"

            echo "  - quality_insights"
            np metadata create --entity build --id "$BUILD_ID" \
              --data "$(cat .nullplatform/metadata/quality_insights.json)"

            echo "Metadata injected successfully."
      - run:
          name: End nullplatform CI (success)
          command: |
            REPOSITORY_URL="${CIRCLE_REPOSITORY_URL%.git}"
            case "$REPOSITORY_URL" in
              git@*) REPOSITORY_URL="https://$(echo "$REPOSITORY_URL" | sed -E 's#^git@([^:]+):#\1/#')" ;;
            esac
            np build update --id "$(cat /tmp/np_build_id)" --repository "$REPOSITORY_URL" --status successful
      - run:
          name: End nullplatform CI (failure)
          when: on_fail
          command: |
            REPOSITORY_URL="${CIRCLE_REPOSITORY_URL%.git}"
            case "$REPOSITORY_URL" in
              git@*) REPOSITORY_URL="https://$(echo "$REPOSITORY_URL" | sed -E 's#^git@([^:]+):#\1/#')" ;;
            esac
            np build update --id "$(cat /tmp/np_build_id)" --repository "$REPOSITORY_URL" --status failed

workflows:
  ci-nullplatform:
    jobs:
      - build:
          filters:
            branches:
              only: main
